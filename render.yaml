services:
  - type: web
    name: srsmutt-temple-billing
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: srsmutt-db
          property: connectionString
      - key: JWT_SECRET
        value: srsmutt_temple_seva_billing_secure_jwt_secret_2026_key

databases:
  - name: srsmutt-db
    plan: free
    region: singapore
    databaseName: srsmutt_db
    user: srsmutt_user
